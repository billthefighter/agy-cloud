apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: agent-tasks-pwa-tls
  namespace: agent-tasks
  labels:
    app.kubernetes.io/part-of: agent-tasks
spec:
  secretName: agent-tasks-pwa-tls
  duration: 8760h
  renewBefore: 720h
  commonName: agy-cloud.example.com
  dnsNames:
    - agy-cloud.example.com
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: your-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-tasks-pwa
  namespace: agent-tasks
  labels:
    app.kubernetes.io/part-of: agent-tasks
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - agy-cloud.example.com
      secretName: agent-tasks-pwa-tls
  rules:
    - host: agy-cloud.example.com
      http:
        paths:
          - path: /agy
            pathType: Prefix
            backend:
              service:
                name: agent-tasks-pwa
                port:
                  number: 8080
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: agent-tasks-pwa
                port:
                  number: 8080
