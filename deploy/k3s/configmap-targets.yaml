apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-tasks-targets
  namespace: agent-tasks
data:
  # Generic example configuration for agy-cloud.
  # Override this ConfigMap via a private Kustomize overlay (e.g., in your
  # private config/plugins repository) rather than committing org-specific
  # repos, Sentry slugs, or personal settings directly into agy-cloud.
  targets.yaml: |
    sentry:
      organization_slug: example-org
      base_url: https://us.sentry.io
      poll_interval_seconds: 180
      lookback_query: "is:unresolved firstSeen:-24h"
      max_issues_per_poll: 5
      settle_seconds: 180
      min_events_bypass_settle: 2
      regression_cooldown_seconds: 3600
      worker_backend: sdk

    projects: {}
      # example-service:
      #   github_repo: example-org/example-repo
      #   default_branch: main
      #   focus_subdir: ""
      #   verify_hint: "pytest"

    slack_coding:
      enabled: false
      github_repo: example-org/example-repo
      default_branch: main
      focus_subdir: ""
      verify_hint: "pytest"
      worker_backend: sdk
      handoff_worker_backend: agy_cli

    ci_healer:
      enabled: false
      poll_interval_seconds: 180
      lookback_hours: 6
      settle_seconds: 90
      cooldown_seconds: 3600
      worker_backend: sdk
      repos: []
        # - github_repo: example-org/example-repo
        #   default_branch: main
        #   verify_hint: "pytest"

    k8s_watchdog:
      enabled: false
      poll_interval_seconds: 120
      settle_polls: 2
      argo_out_of_sync_polls: 15
      recovery_polls: 3
      reopen_cooldown_seconds: 21600
      watched_namespaces:
        - agent-tasks
      ignored_argo_apps:
        - root
        - agent-tasks
      github_repo: example-org/example-repo
      default_branch: main
      verify_hint: ""
      worker_backend: sdk

    dep_upgrader:
      enabled: false
      interval_seconds: 604800
      github_repo: example-org/example-repo
      default_branch: main
      verify_hint: "pytest"
      worker_backend: sdk

    agy_config:
      enabled: false
      github_repo: ""
      branch: main

    channels:
      sentry: ""
      ci: ""
      deps: ""
      k8s: ""
      coding: ""
      billing: ""
      food: ""

    billing:
      enabled: true
      monthly_credit_usd: 100.0
      cycle_anchor_day: 15
      check_interval_seconds: 900
      warn_thresholds_pct: [50.0, 75.0, 90.0, 100.0]
      projected_overrun_warn: true
      min_hours_for_projection: 24.0
      min_spend_usd_for_projection: 3.0
      hard_stop_pct: 95.0

    food_tracker:
      enabled: false
