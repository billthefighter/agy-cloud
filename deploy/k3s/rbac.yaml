apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-tasks-controller
  namespace: agent-tasks
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-tasks-worker
  namespace: agent-tasks
# Worker pods handle untrusted Sentry payloads — never mount K8s API credentials.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-tasks-controller
  namespace: agent-tasks
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-tasks-controller
  namespace: agent-tasks
subjects:
  - kind: ServiceAccount
    name: agent-tasks-controller
    namespace: agent-tasks
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-tasks-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-tasks-controller-watchdog
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-tasks-controller-watchdog
subjects:
  - kind: ServiceAccount
    name: agent-tasks-controller
    namespace: agent-tasks
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-tasks-controller-watchdog
