entrypoint: server:SentryTriagePlugin
channel_roles:
  - role: sentry
    title: Sentry Triage Feed
    description: Automated Sentry root-cause analysis and Draft PR review threads
push_categories:
  - id: sentry
    label: Sentry Issue Triage
    default_enabled: true
